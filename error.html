<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ComicCraft Error
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>

<main class="success-container">

    <div class="success-card error-card">

        <div class="success-icon">
            ⚠️
        </div>

        <h1>
            Something went wrong
        </h1>

        <p>
            {{ error }}
        </p>

        <a
            href="/"
            class="primary-button"
        >
            Try Again
        </a>

    </div>

</main>

</body>

</html>
